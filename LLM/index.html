<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NNUE_Cut</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="app">

    <!-- CỘT TRÁI: nạp mô hình + cấu hình -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="logo">B</span>
        <div><b>NNUE_Cut</b><small>Chạy cục bộ bằng WebAssembly</small></div>
      </div>

      <button class="new-chat-btn" id="newChat" type="button">+ Đoạn chat mới</button>

      <section class="card dropzone" id="dropzone">
        <h2 class="card-header">Mô hình (.bin)</h2>
        <input type="file" id="wFile" accept=".bin" class="file-input">
        <button id="wUp" class="btn btn-accent" type="button" disabled>📁 Chọn tệp .bin</button>
        <div class="hint">hoặc kéo thả tệp vào đây</div>
        <div class="bar"><i id="wBar"></i></div>
        <div id="wInfo" class="msg">Chưa nạp trọng số mô hình.</div>
      </section>
      <section class="card">
        <h2 class="card-header">Suy luận</h2>
        <div class="config-list">
          <label class="config-row"><span class="config-name">Suy nghĩ tối thiểu</span><span class="field"><input
                type="text" id="tmin" value="5" min="0" max="30" class="input-number"><em>s</em></span></label>
          <label class="config-row"><span class="config-name">Suy nghĩ tối đa</span><span class="field"><input
                type="text" id="tmax" value="10" min="0" max="60" class="input-number"><em>s</em></span></label>
          <label class="config-row"><span class="config-name">Beam (1–8)</span><span class="field"><input type="text"
                id="beam" value="5" min="1" max="8" class="input-number"><em></em></span></label>
        </div>
        <div class="hint">Max = 0: suy luận 1 lượt, không “suy nghĩ sâu”.</div>
        <div id="ans" class="msg ok"></div>
      </section>
      <nav id="chatList" class="chat-list" aria-label="Các cuộc trò chuyện">
        <div class="card-header">Cuộc trò chuyện</div>
        <div id="chatItems" class="chat-items"></div>
      </nav>
    </aside>
    <div class="scrim" id="scrim"></div>

    <!-- CỘT PHẢI: không gian chat -->
    <main class="chat">
      <header class="chat-topbar">
        <div class="chat-topbar-inner">
          <button class="menu-btn" id="menuBtn" type="button" aria-label="Mở thanh bên">☰</button>
          <h1 class="chat-title">NNUE_Cut</h1>
          <span id="badge" class="badge wa">· đang nạp WASM…</span>
        </div>
      </header>

      <section id="message-list" aria-label="Tin nhắn"></section>

      <footer class="composer">
        <div class="chat-input-box">
          <textarea id="q" class="chat-textarea" rows="1" placeholder="Nhắn tin…"></textarea>
          <button id="ask" class="send-btn" type="button" title="Gửi" disabled>
            <svg width="18" height="18" viewBox="0 0 23 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="19" x2="12" y2="5"></line>
              <polyline points="5 12 12 5 19 12"></polyline>
            </svg>
          </button>
        </div>
        <span id="title">NNUE_Cut là một AI và có thể sai sót.</span>
      </footer>
    </main>
  </div>

  <script src="js/bit_llm.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
